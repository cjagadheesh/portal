[mypy]
python_version = 3.11
strict = True
warn_unreachable = True

# boto3 ships no type info and adding boto3-stubs is a new dependency (a new dependency needs a discussion first).
[mypy-boto3.*]
ignore_missing_imports = True
[mypy-botocore.*]
ignore_missing_imports = True
[mypy-moto.*]
ignore_missing_imports = True
